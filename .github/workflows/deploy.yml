name: ecommerce-nestjs-deployment

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Đảm bảo chỉ có 1 deployment cho main chạy tại 1 thời điểm
concurrency:
  group: deploy-main
  cancel-in-progress: true

# Env dùng chung (nếu cần)
env:
  IMAGE_REF: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_IMAGE }}

jobs:
  # ===========================
  # CI cho Pull Request
  # ===========================
  ci_pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Dọn bớt disk trên GitHub runner để tránh "no space left on device"
      - name: Free disk space on runner
        run: |
          echo "Disk usage BEFORE cleanup:"
          df -h

          # Xoá bớt SDK/tools nặng pre-installed
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost" || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

          # Dọn docker rác (nếu có)
          docker system prune -af || true

          echo "Disk usage AFTER cleanup:"
          df -h

      - name: Compute PR tag
        id: prmeta
        run: echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        run: |
          REG_LOWER="$(echo "${{ secrets.DOCKER_REGISTRY }}" | tr '[:upper:]' '[:lower:]')"
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login "$REG_LOWER" -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Write build .env for compose (lowercase image ref)
        run: |
          REG_LOWER="$(echo "${{ secrets.DOCKER_REGISTRY }}" | tr '[:upper:]' '[:lower:]')"
          IMG_LOWER="$(echo "${{ secrets.DOCKER_IMAGE }}"   | tr '[:upper:]' '[:lower:]')"

          # ENV_PRODUCTION là nội dung file .env thật của bạn (DB_URL, JWT_SECRET, ...)
          printf '%s\n' "${{ secrets.ENV_PRODUCTION }}" > .env

          # IMAGE_REF + TAG để docker-compose dùng
          echo "IMAGE_REF=${REG_LOWER}/${IMG_LOWER}"   >> .env
          echo "TAG=${{ steps.prmeta.outputs.tag }}"   >> .env

      - name: Build images (compose)
        run: docker compose --profile build build --pull

      - name: Push images (compose)
        run: docker compose --profile build push

  # ===========================
  # CD: Build & Push image khi push main
  # ===========================
  cd_main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image_ref: ${{ steps.meta.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags (lowercase image ref)
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          REG_LOWER="$(echo "${{ secrets.DOCKER_REGISTRY }}" | tr '[:upper:]' '[:lower:]')"
          IMG_LOWER="$(echo "${{ secrets.DOCKER_IMAGE }}"   | tr '[:upper:]' '[:lower:]')"

          echo "image_ref=${REG_LOWER}/${IMG_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free disk space on runner
        run: |
          echo "Disk usage BEFORE cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost" || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

          docker system prune -af || true

          echo "Disk usage AFTER cleanup:"
          df -h

      - name: Login to registry
        run: |
          REG_LOWER="$(echo "${{ secrets.DOCKER_REGISTRY }}" | tr '[:upper:]' '[:lower:]')"
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login "$REG_LOWER" -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Write build .env for compose
        run: |
          printf '%s\n' "${{ secrets.ENV_PRODUCTION }}" > .env
          echo "IMAGE_REF=${{ steps.meta.outputs.image_ref }}" >> .env
          echo "TAG=${{ steps.meta.outputs.tag }}"             >> .env

      - name: Build images (compose)
        run: docker compose --profile build build --pull

      - name: Push images (compose)
        run: docker compose --profile build push

  # ===========================
  # Deploy lên EC2
  # ===========================
  deploy_ec2:
    needs: cd_main
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: ${{ secrets.EC2_PUBLIC_DNS }}
      REMOTE_USER: ${{ secrets.EC2_USER }}
      TAG:         ${{ needs.cd_main.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute registry/image (lowercase)
        id: reg
        run: |
          echo "reg=$(echo "${{ secrets.DOCKER_REGISTRY }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "img=$(echo "${{ secrets.DOCKER_IMAGE }}"   | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Write SSH key
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ci_key
          # Loại \r nếu key được lưu kiểu Windows
          tr -d '\r' < ~/.ssh/ci_key > ~/.ssh/ci_key.tmp && mv ~/.ssh/ci_key.tmp ~/.ssh/ci_key
          chmod 600 ~/.ssh/ci_key
          ssh-keygen -y -f ~/.ssh/ci_key >/dev/null 2>&1 || { echo "Invalid SSH key"; exit 1; }

      - name: Pin known_hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -R "$REMOTE_HOST" 2>/dev/null || true
          ssh-keyscan -T 10 -p 22 -H "$REMOTE_HOST" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "Could not fetch SSH host key"; exit 1; }

      - name: Write .env for EC2
        run: |
          printf '%s\n' "${{ secrets.ENV_PRODUCTION }}" > .env
          echo "IMAGE_REF=${{ steps.reg.outputs.reg }}/${{ steps.reg.outputs.img }}" >> .env
          echo "TAG=${{ env.TAG }}"                                                 >> .env

      - name: Upload compose + .env
        run: |
          ssh -i ~/.ssh/ci_key "$REMOTE_USER@$REMOTE_HOST" \
            "sudo mkdir -p /opt/app && sudo chown $REMOTE_USER:$REMOTE_USER /opt/app"

          scp -i ~/.ssh/ci_key ./docker-compose.yml "$REMOTE_USER@$REMOTE_HOST:/opt/app/docker-compose.yml"
          scp -i ~/.ssh/ci_key ./.env                 "$REMOTE_USER@$REMOTE_HOST:/opt/app/.env"

      - name: Deploy with compose on EC2 (reads /opt/app/.env)
        run: |
          ssh -i ~/.ssh/ci_key "$REMOTE_USER@$REMOTE_HOST" bash -c "'
            set -eux

            # Cài docker nếu chưa có
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg lsb-release
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              echo \"deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \$(. /etc/os-release && echo \$VERSION_CODENAME) stable\" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
            fi

            REG=\"${{ steps.reg.outputs.reg }}\"
            echo \"${{ secrets.DOCKER_TOKEN }}\" | sudo docker login \"\$REG\" -u \"${{ secrets.DOCKER_USERNAME }}\" --password-stdin

            cd /opt/app
            sudo docker compose pull
            sudo docker compose up -d
          '"
