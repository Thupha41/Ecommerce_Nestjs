name: ecommerce-nestjs-deployment

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  IMAGE_REF: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_IMAGE }}

jobs:
  ci_pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute PR tag
        id: prmeta
        run: echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Create .env
        run: |
          printf '%s\n' "${{ secrets.ENV_PRODUCTION }}" > .env


      - name: Build image (no push, load to daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: prtest:${{ steps.prmeta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # If you want to run tests inside builder stage image, uncomment and set target: builder in the build step above
      # - name: Run tests inside container
      #   run: docker run --rm prtest:${{ steps.prmeta.outputs.tag }} npm run test

  cd_main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          REG_LOWER="$(echo "${{ secrets.DOCKER_REGISTRY }}" | tr '[:upper:]' '[:lower:]')"
          IMG_LOWER="$(echo "${{ secrets.DOCKER_IMAGE }}"   | tr '[:upper:]' '[:lower:]')"
          echo "image_ref=${REG_LOWER}/${IMG_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to container registry with PAT
        run: |
          REG_LOWER="$(echo "${{ secrets.DOCKER_REGISTRY }}" | tr '[:upper:]' '[:lower:]')"
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login "$REG_LOWER" \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Create .env
        run: |
          printf '%s\n' "${{ secrets.ENV_PRODUCTION }}" > .env

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image_ref }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_ec2:
    needs: cd_main
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH (install/check Docker, pull & restart with Compose)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euxo pipefail
            
            REGISTRY="${{ secrets.DOCKER_REGISTRY }}"
            IMAGE_REF="${{ needs.cd_main.outputs.image_ref }}"
            TAG="${{ needs.cd_main.outputs.tag }}"

            if [ "$(id -u)" -eq 0 ]; then
              SUDO=""
            else
              SUDO="sudo"
            fi

            ensure_docker() {
              if command -v docker >/dev/null 2>&1; then
                echo "Docker already installed."
                return 0
              fi

              echo "Installing Docker (Ubuntu)..."
              $SUDO apt-get update -y
              $SUDO apt-get install -y ca-certificates curl gnupg lsb-release
              $SUDO install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | $SUDO gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              $SUDO chmod a+r /etc/apt/keyrings/docker.gpg

              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
                https://download.docker.com/linux/ubuntu \
                $(. /etc/os-release && echo $VERSION_CODENAME) stable" | \
                $SUDO tee /etc/apt/sources.list.d/docker.list > /dev/null

              $SUDO apt-get update -y
              $SUDO apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            }

            start_docker_with_retries() {
              local tries=0
              local max=3

              until $SUDO systemctl is-active --quiet docker; do
                tries=$((tries + 1))
                echo "Starting docker (attempt $tries/$max)..."
                $SUDO systemctl daemon-reload || true
                $SUDO systemctl enable docker || true
                $SUDO systemctl start docker || true
                sleep 2

                if $SUDO systemctl is-active --quiet docker; then
                  break
                fi

                if [ "$tries" -ge "$max" ]; then
                  echo "Docker failed to start after $max attempts. Reinstalling once..."
                  $SUDO apt-get install -y --reinstall docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin || true
                  $SUDO systemctl restart docker || true
                  sleep 3
                  if ! $SUDO systemctl is-active --quiet docker; then
                    echo "ERROR: Docker not running after reinstall and retries."
                    exit 1
                  fi
                fi
              done

              echo "Docker is active."
            }

            ensure_docker
            start_docker_with_retries

            REG_LOWER="$(echo "$REGISTRY" | tr '[:upper:]' '[:lower:]')"
            echo "${{ secrets.DOCKER_TOKEN }}" | $SUDO docker login "$REG_LOWER" \
              -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            $SUDO docker pull "${IMAGE_REF}:${TAG}"

            export IMAGE_TAG="${TAG}"
            export IMAGE_REF="${IMAGE_REF}"

            $SUDO docker compose version
            $SUDO docker compose -f /opt/app/docker-compose.yml pull
            $SUDO docker compose -f /opt/app/docker-compose.yml up -d
